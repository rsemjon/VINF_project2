services:
  spark:
    build: .
    image: spark-py312
    # single node: Spark Connect server running in local mode (what extractor.py connects to)
    command: >
      /opt/spark/bin/spark-submit
      --class org.apache.spark.sql.connect.service.SparkConnectServer
      --master local[*]
      --driver-memory 6g
    ports:
      - "15002:15002"   # Spark Connect (SPARK_REMOTE in extractor.py)
      - "4040:4040"     # Spark UI
    volumes:
      - ../crawler_data:/data     # input  (CONTAINER_INPUT_DIR)
      - ./data:/output            # output (CONTAINER_OUTPUT_DIR)
      - .:/app
